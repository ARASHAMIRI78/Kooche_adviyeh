<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | کوچه ادویه</title>
<link rel="stylesheet" href="style.css">

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K649S3PQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<header class="site">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="name">کوچه ادویه</span>
      <span class="tagline">عطر اصیل، از دل بازار</span>
    </a>
    <nav class="main">
      <a href="index.html">خانه</a>
      <a href="index.html#grid">محصولات</a>
      <a class="cart-link" href="cart.html">🛒 سبد خرید <span id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main class="container cart-wrap">
  <h1>سبد خرید</h1>

  <div id="cart-empty" class="empty-cart" style="display:none">
    سبد خرید شما خالی است. <a href="index.html">مشاهده محصولات</a>
  </div>

  <div id="cart-items"></div>

  <div id="cart-summary" class="cart-summary">
    <span class="total">جمع کل: <span id="cart-total"></span></span>
    <button id="checkout-btn" class="checkout-btn">تکمیل خرید</button>
  </div>

  <div class="panel">
    <h2>عضویت در خبرنامه</h2>
    <form id="newsletter-form">
      <input type="email" placeholder="ایمیل شما" required>
      <button type="submit">عضویت</button>
    </form>
    <div id="newsletter-msg" class="confirm-msg">با تشکر، عضویت شما ثبت شد.</div>
  </div>

  <div class="panel">
    <h2>تماس با ما</h2>
    <form id="contact-form">
      <input type="text" placeholder="نام شما" required>
      <textarea placeholder="پیام شما" required></textarea>
      <button type="submit">ارسال پیام</button>
    </form>
    <div id="contact-msg" class="confirm-msg">پیام شما ارسال شد.</div>
  </div>
</main>

<footer class="site">
  <div class="swatch-divider">
    <span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span><span class="c5"></span>
  </div>
  <div class="container">کوچه ادویه — پروژه نمایشی پورتفولیو بازاریابی داده‌محور</div>
</footer>

<script src="products.js"></script>
<script src="app.js"></script>
<script src="home.js"></script>
</body>
</html>
