<header class="site">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="name">کوچه ادویه</span>
      <span class="tagline">عطر اصیل، از دل بازار</span>
    </a>
    <nav class="main">
      <a href="index.html">خانه</a>
      <a href="index.html#grid">محصولات</a>
      <a class="cart-link" href="cart.html">🛒 سبد خرید <span id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<div class="container crumb">
  <a href="index.html">خانه</a> / <span id="crumb-name"></span>
</div>

<main class="container pdp">
  <div id="pdp-image" class="image"></div>
  <div>
    <span id="pdp-cat" class="cat-tag"></span>
    <h1 id="pdp-title"></h1>
    <p id="pdp-desc" class="desc"></p>

    <div class="pkg-group">
      <div class="pkg-label">انتخاب بسته‌بندی</div>
      <div id="pkg-options"></div>
    </div>

    <div class="qty-row">
      <span class="pkg-label">تعداد</span>
      <div class="qty-box">
        <button id="qty-minus" type="button">−</button>
        <input id="qty-input" type="text" value="1" inputmode="numeric">
        <button id="qty-plus" type="button">+</button>
      </div>
    </div>

    <button id="add-btn" class="add-btn">افزودن به سبد خرید</button>
    <div id="confirm-msg" class="confirm-msg"></div>
  </div>
</main>

<div class="container related">
  <h2>محصولات مرتبط</h2>
  <div class="grid" id="related-grid"></div>
</div>

  <div class="swatch-divider">
